<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Favicons. Two different files on purpose.

      favicon.ico has a transparent background, which is what a browser tab
      wants: it sits on whatever colour the tab happens to be. The white disc
      behind the logo in a Google result is Google's own chip showing through
      that transparency, not part of the mark.

      apple-touch-icon points at the version with the navy ground baked in.
      Google lists apple-touch-icon among the icons it will use, and it is the
      only one of the two it reads that a browser tab does not — so the search
      result can carry the full logo while the tab keeps the transparent one.
      It is also what iOS uses for a home-screen shortcut, where transparency
      is composited against black and looks worse than the navy.
    -->
    <link rel="icon" type="image/x-icon" sizes="any" href="src/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="src/assets/favicon.jpg" />

    <!-- Optimisation SEO -->
    <title>
      Dar L'emploi | Recrutement DZ et Offre d'Emploi en Algérie - عروض عمل في الجزائر
    </title>

    <meta
      name="description"
      content="Trouvez votre prochain emploi en Algérie avec Dar L'emploi. Consultez nos offres (عروض عمل), déposez votre CV (إرسال السيرة الذاتية) et recrutez des talents locaux."
    />

    <meta
      name="keywords"
      content="emploi Algérie, recrutement Algérie, trouver un travail, publier une annonce, عروض عمل في الجزائر, توظيف الجزائر, موقع توظيف, البحث عن وظيفة"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
